<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Pokopia小队 · 实用攻略便捷查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #e8f3e8;
            padding: 20px 16px 20px;
        }

        .app {
            max-width: 1260px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 40px);
        }

        /* 头部 — 绿色调 */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 24px;
            background: rgba(235, 245, 235, 0.85);
            backdrop-filter: blur(8px);
            padding: 12px 24px;
            border-radius: 60px;
            box-shadow: 0 6px 20px rgba(0, 80, 0, 0.1);
            border: 1px solid #b0d8b0;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.4rem;
            color: #2d6a4f;
            letter-spacing: 1px;
        }
        .logo-icon { font-size: 1.8rem; }

        .search-wrapper {
            flex: 1;
            min-width: 240px;
            display: flex;
            align-items: center;
            background: white;
            border-radius: 40px;
            border: 1px solid #a0c0a0;
            transition: box-shadow 0.2s;
        }
        .search-wrapper:focus-within {
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.25);
            border-color: #2d6a4f;
        }
        .search-wrapper input {
            flex: 1;
            border: none;
            padding: 12px 20px;
            border-radius: 40px 0 0 40px;
            font-size: 1rem;
            outline: none;
            background: transparent;
        }
        .search-wrapper button {
            background: #2d6a4f;
            border: none;
            color: white;
            padding: 10px 22px;
            border-radius: 40px;
            margin: 4px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .admin-btn {
            background: #1e4b37;
            color: white;
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(0,60,0,0.2);
        }
        .admin-btn:hover { background: #40916c; transform: rotate(90deg); }

        /* 瀑布流两列 */
        .waterfall {
            column-count: 2;
            column-gap: 20px;
            margin-top: 10px;
            flex: 1;
        }
        .post-card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 40, 0, 0.08);
            transition: 0.2s;
            border: 1px solid #c8e0c8;
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .post-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 32px rgba(0, 60, 0, 0.15);
        }

        /* 置顶样式 - 红色外框和标签 */
        .post-card.pinned {
            border: 3px solid #ff4d4d;
            box-shadow: 0 10px 25px rgba(255, 77, 77, 0.3);
        }
        
        /* 置顶标签 */
        .pinned-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ff4d4d;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 15;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 1px solid #ff9999;
            backdrop-filter: blur(2px);
        }

        /* 自定义角标（与置顶标签不冲突） */
        .custom-badge {
            position: absolute;
            top: 12px;
            left: 90px;  /* 给置顶标签留空间，如果有置顶的话 */
            background: #ffb74d;
            color: #1e3a2a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            z-index: 10;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            border: 1px solid #ffe082;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            backdrop-filter: blur(2px);
        }
        
        /* 如果没有置顶，自定义角标回到左边 */
        .post-card:not(.pinned) .custom-badge {
            left: 12px;
        }

        /* 图片轮播容器 */
        .image-carousel-container {
            position: relative;
            width: 100%;
            background: #e0f0e0;
            line-height: 0;
        }
        .image-carousel {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 4px;
            background: #e0f0e0;
            scrollbar-width: none;
            -ms-overflow-style: none;
            cursor: grab;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            width: 100%;
            line-height: 0;
        }
        .image-carousel::-webkit-scrollbar {
            display: none;
        }
        .carousel-img {
            scroll-snap-align: start;
            flex: 0 0 auto;
            width: 100%;
            height: auto;
            object-fit: cover;
            background: #e0f0e0;
            cursor: pointer;
            user-select: none;
            display: block;
        }

        /* 小圆点指示器 */
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 8px 0 10px;
            background: rgba(240, 250, 240, 0.7);
            backdrop-filter: blur(2px);
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 5;
            border-radius: 0 0 20px 20px;
            line-height: 1;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #a0c0a0;
            transition: all 0.2s;
            cursor: pointer;
        }
        .dot.active {
            background: #1e4b37;
            width: 20px;
            border-radius: 10px;
        }

        /* 图片查看器 */
        .image-viewer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,30,0,0.9);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .viewer-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
        }
        .viewer-content img {
            max-width: 100%;
            max-height: 85vh;
            border-radius: 20px;
            box-shadow: 0 20px 40px black;
        }
        .close-viewer {
            position: absolute;
            top: -40px; right: 0;
            font-size: 48px;
            color: white;
            cursor: pointer;
        }

        .card-content {
            padding: 16px 14px 12px;
            background: white;
        }
        .card-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: #1e4b37;
        }
        .card-text {
            font-size: 0.95rem;
            color: #2d4a2d;
            line-height: 1.5;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #c0ddc0;
            padding-top: 12px;
            font-size: 0.85rem;
            color: #3d5e3d;
            flex-wrap: wrap;
            gap: 8px;
        }
        .left-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .publisher {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .avatar-img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a8d5a8;
        }
        .publisher-info {
            display: flex;
            flex-direction: column;
        }
        .publisher-name {
            font-weight: 600;
            color: #1e4b37;
            line-height: 1.3;
        }
        .source-tag {
            font-size: 0.7rem;
            background: #d0ecd0;
            padding: 2px 10px;
            border-radius: 30px;
            color: #1d543d;
            font-weight: 500;
            display: inline-block;
            margin-top: 2px;
            width: fit-content;
        }
        .post-time { 
            color: #4d734d;
            white-space: nowrap;
        }

        /* 右侧操作区域（点赞 + 三个点） */
        .right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 点赞按钮 - 与置顶删除样式区分 */
        .like-btn {
            background: #f0f0f0;
            border: 2px solid #ffb3b3;
            color: #ff4d4d;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(255, 77, 77, 0.2);
        }
        .like-btn:hover {
            background: #ffe6e6;
            border-color: #ff4d4d;
            transform: scale(1.05);
        }
        .like-btn.liked {
            background: #ff4d4d;
            color: white;
            border-color: #ff9999;
        }
        .like-count {
            font-weight: 700;
            min-width: 20px;
            text-align: center;
        }

        /* 操作按钮（三个点） */
        .action-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            color: #2d6a4f;
            padding: 0 6px;
            border-radius: 50%;
            transition: background 0.2s;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 20;
        }
        .action-toggle:hover {
            background: #d0ecd0;
        }

        /* 管理员操作面板 - 向上展开 */
        .admin-actions-panel {
            position: absolute;
            background: white;
            border: 2px solid #a0d0a0;
            border-radius: 30px;
            padding: 12px 16px;
            box-shadow: 0 10px 25px rgba(0,40,0,0.3);
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            right: 0;
            bottom: 30px;
            min-width: 280px;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.95);
        }
        .admin-actions-panel.hidden {
            display: none;
        }
        .admin-actions-panel input {
            width: 90px;
            padding: 6px 10px;
            border-radius: 30px;
            border: 1px solid #a0c0a0;
            font-size: 0.75rem;
        }
        .admin-actions-panel button {
            background: #e0f0e0;
            border: 1px solid #7dab7d;
            color: #1e4b37;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .admin-actions-panel button:hover {
            background: #b0d8b0;
        }

        /* 空状态 */
        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #5d855d;
            background: white;
            border-radius: 40px;
        }

        /* 底部声明 */
        .footer-declaration {
            margin-top: 30px;
            padding: 20px 25px;
            background: rgba(200, 225, 200, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            text-align: center;
            font-size: 0.9rem;
            color: #1e4b37;
            border: 1px solid #a0c8a0;
            line-height: 1.6;
        }
        .footer-declaration a {
            color: #1e4b37;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dotted #2d6a4f;
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,40,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #f0faf0;
            width: 90%;
            max-width: 480px;
            border-radius: 40px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px rgba(0,30,0,0.3);
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid #a0d0a0;
        }
        .modal-card h3 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1e4b37;
        }
        .modal-card input, .modal-card textarea, .modal-card select {
            width: 100%;
            padding: 14px 18px;
            margin-bottom: 16px;
            border: 1px solid #a0c0a0;
            border-radius: 30px;
            font-size: 1rem;
            outline: none;
            background: white;
        }
        .modal-card textarea { min-height: 80px; }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }
        .modal-actions button {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancel { background: #d0e0d0; color: #2d4a2d; }
        .btn-submit { background: #1e4b37; color: white; }
        .close-icon {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 28px;
            cursor: pointer;
            color: #6d8f6d;
        }
        .close-icon:hover { color: #1e4b37; }
        .hint { color: #5d855d; font-size: 0.8rem; margin-top: -10px; margin-bottom: 16px; }

        @media (max-width: 600px) {
            .waterfall { column-count: 1; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- 头部 -->
    <div class="header">
        <div class="logo-area">
            <span class="logo-icon">🌿</span>
            <span>Pokopia小队</span>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="搜索标题或文案...">
            <button id="searchBtn">🔍 搜索</button>
        </div>
        <button class="admin-btn" id="addPostBtn" title="发布新帖">+</button>
    </div>

    <!-- 瀑布流容器 -->
    <div id="waterfallContainer" class="waterfall"></div>

    <!-- 底部声明 -->
    <div class="footer-declaration">
        仅作为Pokopia群内成员便捷攻略查询，出处均已标记，请多多支持攻略作者，如有不妥可联系邮箱：<a href="mailto:rcha@qq.com">rcha@qq.com</a>删除
    </div>
</div>

<!-- 图片查看器 -->
<div class="image-viewer" id="imageViewer">
    <div class="viewer-content">
        <span class="close-viewer" id="closeViewerBtn">&times;</span>
        <img id="viewerImg" src="" alt="放大图">
    </div>
</div>

<!-- 新增帖子模态框 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
        <span class="close-icon" id="closeModalBtn">&times;</span>
        <h3>发布新帖子</h3>
        <input type="password" id="secretKey" placeholder="发布秘钥" value="">
        <div class="key-hint" style="color:#2d6a4f; margin-bottom:12px;">🔐 需要输入正确秘钥才能发布</div>

        <input type="text" id="postTitle" placeholder="标题">
        <textarea id="postContent" placeholder="文案..."></textarea>
        <input type="text" id="postSource" placeholder="来源 (例如 B站、小红书、自定義)" value="小红书">
        <input type="text" id="postPublisher" placeholder="发布者名字" value="管理员">
        <input type="text" id="postAvatar" placeholder="头像图片URL (留空则自动生成)">
        <div class="hint">✨ 头像留空自动生成</div>
        <textarea id="postImages" placeholder="图片URL列表 (一行一个，或英文逗号分隔)&#10;例如：https://...1.jpg, https://...2.jpg"></textarea>
        <div class="hint">✨ 图片留空则自动随机一张</div>

        <div class="modal-actions">
            <button class="btn-cancel" id="cancelModalBtn">取消</button>
            <button class="btn-submit" id="submitPostBtn">发布</button>
        </div>
    </div>
</div>

<script>
    (function() {
        let allPosts = [];
        let filteredPosts = [];

        const STORAGE_KEY = 'pokopia_final_v4';
        const SECRET_KEY = 'rcha6666';

        function getRandomAvatar(name = 'User') {
            const seed = name.charCodeAt(0) || Math.floor(Math.random()*100);
            return `https://picsum.photos/seed/${seed}32/100/100?random=${Date.now()}`;
        }

        const defaultPosts = [
            {
                id: Date.now() - 10000,
                title: '森林野餐指南 🥗',
                content: '带上青团和荠菜饭，找一片树荫。',
                images: ['https://picsum.photos/id/26/400/500', 'https://picsum.photos/id/30/400/500'],
                publisher: '青草味',
                avatar: '',
                source: 'B站',
                pinned: false,
                badge: '',
                likes: 5,
                likedBy: [],
                publishTime: new Date(Date.now() - 86400000).toISOString()
            },
            {
                id: Date.now() - 20000,
                title: '苔藓微景观教程',
                content: '瓶子里的小森林，很好养。',
                images: ['https://picsum.photos/id/58/400/620'],
                publisher: '植觉',
                avatar: 'https://picsum.photos/id/64/100/100',
                source: '小红书',
                pinned: true,
                badge: '🔥 热门',
                likes: 12,
                likedBy: [],
                publishTime: new Date(Date.now() - 172800000).toISOString()
            },
            {
                id: Date.now() - 30000,
                title: '雨天徒步装备',
                content: '防水背包、徒步鞋、速干衣。',
                images: ['https://picsum.photos/id/15/400/560', 'https://picsum.photos/id/21/400/530', 'https://picsum.photos/id/45/400/500'],
                publisher: '山野阿明',
                avatar: '',
                source: '抖音',
                pinned: false,
                badge: '',
                likes: 8,
                likedBy: [],
                publishTime: new Date(Date.now() - 300000000).toISOString()
            }
        ];

        function loadPosts() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    allPosts = JSON.parse(stored);
                } catch (e) { allPosts = [...defaultPosts]; }
            } else {
                allPosts = [...defaultPosts];
            }
            allPosts = allPosts.map(p => {
                if (!p.images) p.images = p.imageUrl ? [p.imageUrl] : ['https://picsum.photos/400/500?random='+p.id];
                if (!p.avatar) p.avatar = '';
                if (!p.source) p.source = '小红书';
                if (p.pinned === undefined) p.pinned = false;
                if (!p.badge) p.badge = '';
                if (p.likes === undefined) p.likes = 0;
                if (!p.likedBy) p.likedBy = [];
                return p;
            });
            sortPosts();
            filteredPosts = [...allPosts];
        }

        function sortPosts() {
            allPosts.sort((a, b) => {
                // 置顶优先
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                // 然后按点赞数降序
                if (a.likes !== b.likes) return b.likes - a.likes;
                // 最后按时间降序
                return new Date(b.publishTime) - new Date(a.publishTime);
            });
        }

        function savePosts() { 
            sortPosts();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(allPosts)); 
        }

        function toggleLike(postId, userId = 'anonymous') {
            const post = allPosts.find(p => p.id === postId);
            if (!post) return;
            
            if (post.likedBy.includes(userId)) {
                // 取消点赞
                post.likes = Math.max(0, post.likes - 1);
                post.likedBy = post.likedBy.filter(id => id !== userId);
            } else {
                // 点赞
                post.likes = (post.likes || 0) + 1;
                post.likedBy.push(userId);
            }
            
            savePosts();
            
            // 更新当前显示的列表
            if (document.getElementById('searchInput').value.trim()) {
                performSearch(document.getElementById('searchInput').value);
            } else {
                filteredPosts = [...allPosts];
            }
            renderPosts(filteredPosts);
        }

        function renderPosts(posts) {
            const container = document.getElementById('waterfallContainer');
            if (!container) return;
            if (!posts || posts.length === 0) {
                container.innerHTML = `<div class="empty-message">✨ 没有匹配的帖子</div>`;
                return;
            }

            let html = '';
            posts.forEach(post => {
                const date = new Date(post.publishTime);
                const timeStr = `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2,'0')}-${date.getDate().toString().padStart(2,'0')} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                const avatarSrc = post.avatar && post.avatar.trim() ? post.avatar : getRandomAvatar(post.publisher);
                const pinnedClass = post.pinned ? 'pinned' : '';

                // 构建带小圆点的轮播
                const images = post.images && post.images.length ? post.images : [`https://picsum.photos/400/500?random=${post.id}`];
                const dotsId = `dots-${post.id}`;
                
                let carouselHtml = `
                    <div class="image-carousel-container">
                        <div class="image-carousel" id="carousel-${post.id}">
                `;
                images.forEach((imgUrl, idx) => {
                    carouselHtml += `<img class="carousel-img" src="${escapeHtml(imgUrl)}" alt="帖子图" loading="lazy" onclick="openViewer('${escapeHtml(imgUrl)}')" data-index="${idx}">`;
                });
                carouselHtml += `</div>`;
                
                // 小圆点区域
                if (images.length > 1) {
                    carouselHtml += `<div class="carousel-dots" id="${dotsId}">`;
                    images.forEach((_, idx) => {
                        carouselHtml += `<span class="dot ${idx === 0 ? 'active' : ''}" data-carousel-id="${post.id}" data-index="${idx}"></span>`;
                    });
                    carouselHtml += `</div>`;
                }
                carouselHtml += `</div>`;

                // 置顶标签
                const pinnedTagHtml = post.pinned ? `<div class="pinned-badge">📌 置顶</div>` : '';
                
                // 自定义角标
                const customBadgeHtml = post.badge ? `<div class="custom-badge">${escapeHtml(post.badge)}</div>` : '';

                html += `
                    <div class="post-card ${pinnedClass}" data-id="${post.id}">
                        ${pinnedTagHtml}
                        ${customBadgeHtml}
                        ${carouselHtml}
                        <div class="card-content">
                            <div class="card-title">${escapeHtml(post.title) || '无标题'}</div>
                            <div class="card-text">${escapeHtml(post.content) || ''}</div>
                            <div class="card-meta">
                                <div class="left-meta">
                                    <div class="publisher">
                                        <img class="avatar-img" src="${escapeHtml(avatarSrc)}" alt="头像" onerror="this.src='https://picsum.photos/32/32?random=1'">
                                        <div class="publisher-info">
                                            <span class="publisher-name">${escapeHtml(post.publisher) || '匿名'}</span>
                                            <span class="source-tag">${escapeHtml(post.source) || '其他'}</span>
                                        </div>
                                    </div>
                                    <span class="post-time">${timeStr}</span>
                                </div>
                                <div class="right-actions">
                                    <!-- 点赞按钮 -->
                                    <button class="like-btn ${post.likedBy.includes('anonymous') ? 'liked' : ''}" onclick="toggleLike(${post.id})">
                                        👍 <span class="like-count">${post.likes || 0}</span>
                                    </button>
                                    <!-- 操作按钮（三个点） -->
                                    <div style="position:relative;">
                                        <button class="action-toggle" onclick="toggleActionPanel(${post.id})">⋮</button>
                                        <div id="panel-${post.id}" class="admin-actions-panel hidden" data-post-id="${post.id}">
                                            <input type="password" class="action-key" placeholder="秘钥" style="width:90px;">
                                            <button class="pin-btn">📌 置顶</button>
                                            <button class="delete-btn">🗑️ 删除</button>
                                            <input type="text" class="badge-input" placeholder="角标" value="${escapeHtml(post.badge || '')}" style="width:90px;">
                                            <button class="badge-btn">🏷️ 添加</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // 为每个轮播添加滑动同步小圆点的事件
            posts.forEach(post => {
                const carousel = document.getElementById(`carousel-${post.id}`);
                if (!carousel) return;
                const dotsContainer = document.getElementById(`dots-${post.id}`);
                if (!dotsContainer) return;

                const updateDots = () => {
                    const scrollLeft = carousel.scrollLeft;
                    const cardWidth = carousel.clientWidth;
                    if (cardWidth === 0) return;
                    const activeIndex = Math.round(scrollLeft / cardWidth);
                    const dots = dotsContainer.querySelectorAll('.dot');
                    dots.forEach((dot, idx) => {
                        if (idx === activeIndex) dot.classList.add('active');
                        else dot.classList.remove('active');
                    });
                };

                carousel.addEventListener('scroll', updateDots);
                
                dotsContainer.querySelectorAll('.dot').forEach(dot => {
                    dot.addEventListener('click', (e) => {
                        const index = e.target.dataset.index;
                        if (index !== undefined) {
                            const cardWidth = carousel.clientWidth;
                            carousel.scrollTo({ left: index * cardWidth, behavior: 'smooth' });
                        }
                    });
                });
            });
        }

        // 切换操作面板显示
        window.toggleActionPanel = function(postId) {
            document.querySelectorAll('.admin-actions-panel').forEach(p => p.classList.add('hidden'));
            const panel = document.getElementById(`panel-${postId}`);
            if (panel) {
                panel.classList.toggle('hidden');
            }
        };

        // 全局点击关闭面板
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.admin-actions-panel') && !e.target.closest('.action-toggle')) {
                document.querySelectorAll('.admin-actions-panel').forEach(p => p.classList.add('hidden'));
            }
        });

        // 操作绑定
        document.addEventListener('click', function(e) {
            const panel = e.target.closest('.admin-actions-panel');
            if (!panel) return;
            e.stopPropagation();
            const postId = Number(panel.dataset.postId);
            const keyInput = panel.querySelector('.action-key');
            const key = keyInput ? keyInput.value : '';

            if (e.target.classList.contains('pin-btn')) {
                if (key !== SECRET_KEY) { alert('❌ 秘钥错误'); return; }
                togglePinPost(postId);
                panel.classList.add('hidden');
            }
            else if (e.target.classList.contains('delete-btn')) {
                if (key !== SECRET_KEY) { alert('❌ 秘钥错误'); return; }
                if (confirm('确定删除该帖子？')) {
                    deletePost(postId);
                }
                panel.classList.add('hidden');
            }
            else if (e.target.classList.contains('badge-btn')) {
                if (key !== SECRET_KEY) { alert('❌ 秘钥错误'); return; }
                const badgeInput = panel.querySelector('.badge-input');
                const badgeText = badgeInput ? badgeInput.value.trim() : '';
                setBadgeForPost(postId, badgeText);
                panel.classList.add('hidden');
            }
        });

        function togglePinPost(postId) {
            const post = allPosts.find(p => p.id === postId);
            if (post) {
                post.pinned = !post.pinned;
                savePosts();
                if (document.getElementById('searchInput').value.trim()) {
                    performSearch(document.getElementById('searchInput').value);
                } else {
                    filteredPosts = [...allPosts];
                }
                renderPosts(filteredPosts);
            }
        }

        function deletePost(postId) {
            allPosts = allPosts.filter(p => p.id !== postId);
            savePosts();
            if (document.getElementById('searchInput').value.trim()) {
                performSearch(document.getElementById('searchInput').value);
            } else {
                filteredPosts = [...allPosts];
            }
            renderPosts(filteredPosts);
        }

        function setBadgeForPost(postId, badgeText) {
            const post = allPosts.find(p => p.id === postId);
            if (post) {
                post.badge = badgeText;
                savePosts();
                if (document.getElementById('searchInput').value.trim()) {
                    performSearch(document.getElementById('searchInput').value);
                } else {
                    filteredPosts = [...allPosts];
                }
                renderPosts(filteredPosts);
            }
        }

        window.toggleLike = function(postId) {
            toggleLike(postId, 'anonymous');
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"]/g, function(m){
                return m === '&' ? '&amp;' : m === '<' ? '&lt;' : m === '>' ? '&gt;' : m === '"' ? '&quot;' : m;
            });
        }

        function performSearch(keyword) {
            if (!keyword.trim()) { filteredPosts = [...allPosts]; }
            else {
                const lower = keyword.toLowerCase().trim();
                filteredPosts = allPosts.filter(p => 
                    (p.title && p.title.toLowerCase().includes(lower)) ||
                    (p.content && p.content.toLowerCase().includes(lower))
                );
            }
            renderPosts(filteredPosts);
        }

        function addNewPost(title, content, publisher, avatar, source, imagesArray, secret) {
            if (secret !== SECRET_KEY) {
                alert('❌ 秘钥错误，无法发布');
                return false;
            }
            let finalImages = imagesArray.filter(url => url && url.trim() !== '');
            if (finalImages.length === 0) {
                const randomId = Math.floor(Math.random() * 200) + 10;
                finalImages = [`https://picsum.photos/id/${randomId}/400/500`];
            }
            const newPost = {
                id: Date.now(),
                title: title.trim() || '无标题',
                content: content.trim() || ' ',
                images: finalImages,
                publisher: publisher.trim() || '匿名',
                avatar: avatar.trim() || '',
                source: source.trim() || '其他',
                pinned: false,
                badge: '',
                likes: 0,
                likedBy: [],
                publishTime: new Date().toISOString()
            };
            allPosts.unshift(newPost);
            savePosts();
            document.getElementById('searchInput').value = '';
            filteredPosts = [...allPosts];
            renderPosts(filteredPosts);
            return true;
        }

        window.openViewer = function(imgSrc) {
            const viewer = document.getElementById('imageViewer');
            const viewerImg = document.getElementById('viewerImg');
            if (viewer && viewerImg) {
                viewerImg.src = imgSrc;
                viewer.style.display = 'flex';
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadPosts();
            renderPosts(filteredPosts);

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const addPostBtn = document.getElementById('addPostBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const cancelModalBtn = document.getElementById('cancelModalBtn');
            const submitPostBtn = document.getElementById('submitPostBtn');
            const closeViewerBtn = document.getElementById('closeViewerBtn');
            const imageViewer = document.getElementById('imageViewer');

            searchBtn.addEventListener('click', () => performSearch(searchInput.value));
            searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performSearch(searchInput.value); });

            addPostBtn.addEventListener('click', () => {
                modalOverlay.style.display = 'flex';
                document.getElementById('secretKey').value = '';
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postPublisher').value = '管理员';
                document.getElementById('postAvatar').value = '';
                document.getElementById('postSource').value = '小红书';
                document.getElementById('postImages').value = '';
            });

            function closeModal() { modalOverlay.style.display = 'none'; }
            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });

            submitPostBtn.addEventListener('click', () => {
                const secret = document.getElementById('secretKey').value;
                const title = document.getElementById('postTitle').value;
                const content = document.getElementById('postContent').value;
                const publisher = document.getElementById('postPublisher').value;
                const avatar = document.getElementById('postAvatar').value;
                const source = document.getElementById('postSource').value;
                const imagesRaw = document.getElementById('postImages').value;

                if (!title.trim() && !content.trim()) { alert('标题或文案至少填一项'); return; }

                let imagesList = [];
                if (imagesRaw.trim()) {
                    imagesList = imagesRaw.split(/[,\n]+/).map(s => s.trim()).filter(s => s.startsWith('http'));
                }

                const success = addNewPost(title, content, publisher, avatar, source, imagesList, secret);
                if (success) closeModal();
            });

            closeViewerBtn.addEventListener('click', () => { imageViewer.style.display = 'none'; });
            imageViewer.addEventListener('click', (e) => { if (e.target === imageViewer) imageViewer.style.display = 'none'; });
        });
    })();
</script>
</body>
</html>
